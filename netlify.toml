# ==============================================================================
# BIZLENS - NETLIFY CONFIGURATION (Root)
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Optional: If you want Netlify to reverse-proxy API requests to your deployed backend,
# uncomment the block below and replace YOUR-BACKEND-URL:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-URL.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback (prevents 404 on page refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
