version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://bizlens_user:bizlens_secret@postgres:5432/bizlens
      - STORAGE_ROOT=/app/storage
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - bizlens_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bizlens_user
      - POSTGRES_PASSWORD=bizlens_secret
      - POSTGRES_DB=bizlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizlens_user -d bizlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bizlens_storage:
  postgres_data:
